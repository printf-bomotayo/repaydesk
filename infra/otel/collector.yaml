# Every Repaydesk service sends traces here over OTLP. The collector batches them, drops
# attributes that could carry personal data, and forwards to Jaeger. Langfuse is added as
# a second exporter when the langfuse profile is on (see compose.langfuse.yaml).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}
  memory_limiter:
    check_interval: 1s
    limit_mib: 200
  # Belt and braces: services mask PII before it reaches a span, and this removes
  # the attributes that should never be exported even if a service forgets.
  attributes/scrub:
    actions:
      - key: borrower.phone
        action: delete
      - key: borrower.name
        action: delete
      - key: payment.narration
        action: delete

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/scrub, batch]
      exporters: [otlp/jaeger]
