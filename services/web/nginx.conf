server {
    listen 80;
    root /usr/share/nginx/html;

    # The API, on the app's own origin: no cross-origin requests, so nothing to allow. No URI on
    # proxy_pass, so the path goes through exactly as the browser sent it (line ids carry '#' and
    # ':'), and the API strips the /api prefix itself.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz { access_log off; return 200 "ok\n"; }

    # Hashed build files never change; cache them for a year. index.html always revalidates.
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }

    # Every other path is a screen in the app.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy same-origin;
        add_header X-Frame-Options DENY;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'";
    }
}
