name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  core:
    name: lint and test (Postgres, no stack)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: repaydesk
          POSTGRES_PASSWORD: repaydesk
          POSTGRES_DB: repaydesk
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U repaydesk" --health-interval 5s --health-retries 20
    env:
      REPAYDESK_TEST_DATABASE_URL: postgresql://repaydesk:repaydesk@127.0.0.1:5432/repaydesk
    defaults:
      run:
        working-directory: services/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/core/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q

  web:
    name: web app (type check, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  compose:
    name: compose file is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose --profile tools config --quiet

  stack:
    # The whole stack, a small seed, and the contract tests against real Fineract and Odoo.
    # About ten minutes, so it runs on main and on demand, not on every pull request.
    name: stack, seed and contract tests
    if: github.event_name != 'pull_request'
    needs: [core, web, compose]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEED_BORROWERS: "300"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cp .env.example .env
      # Docker would create the bind-mounted folder as root; the containers run as a non-root user.
      - run: mkdir -p data && chmod 777 data
      - run: docker compose up -d --wait --wait-timeout 900
      - run: docker compose run --rm --build seed
      - name: ingest the week's files, then deliver its webhooks to the API
        run: |
          docker compose run --rm --build ingest
          docker compose run --rm ingest python -m repaydesk.ingest --replay-webhooks http://api:8000
      - name: rule matching, scored against the truth file (fails on any wrong proposal)
        run: |
          docker compose run --rm --build match
          docker compose run --rm match python -m repaydesk.scoring
      - name: the web app serves, and reaches the API through its own origin
        run: |
          curl -fsS http://127.0.0.1:18082/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:18082/payments/anything | grep -q '<div id="root">'
          password=$(grep '^STAFF_DEMO_PASSWORD=' .env | cut -d= -f2-)
          token=$(curl -fsS -X POST http://127.0.0.1:18082/api/auth/sign-in -H 'Content-Type: application/json'             -d "{\"staff_id\":\"hadiza\",\"password\":\"$password\"}" | python -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          curl -fsS http://127.0.0.1:18082/api/lines?limit=1 -H "Authorization: Bearer $token" | python -c 'import json,sys; d=json.load(sys.stdin); assert d["total"] > 0, d; print(d["total"], "lines")'
      - run: pip install -e "services/core[dev]"
      - name: contract tests against Fineract and Odoo
        working-directory: services/core
        env:
          FINERACT_URL: http://127.0.0.1:18080/fineract-provider/api/v1
          ODOO_URL: http://127.0.0.1:18069
        run: pytest -q -m integration
      - name: the seed left a trace in Jaeger
        run: |
          curl -sf "http://127.0.0.1:16686/api/traces?service=repaydesk-seed&limit=1" | python -c \
            "import json,sys; d=json.load(sys.stdin)['data']; assert d and len(d[0]['spans']) > 100, 'no seed trace'; print(len(d[0]['spans']), 'spans')"
      - if: failure()
        run: docker compose logs --tail=200
