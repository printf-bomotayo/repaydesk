# Repaydesk local stack. `make up` (or `python scripts/dev.py up`) starts it and seeds it.
#
#   Fineract   core banking: borrowers, loans, schedules, repayments   http://localhost:18080
#   Mifos      Fineract's staff screens                                 http://localhost:18081
#   Odoo       finance ledger: collection accounts, suspense, journals  http://localhost:18069
#   Postgres   one instance, a database per system                      localhost:15432
#   Collector  OpenTelemetry in, Jaeger out
#   Jaeger     traces                                                   http://localhost:16686
#   API        webhooks, sign-in, approvals, the web app's reads          http://localhost:18000
#   Web        Repaydesk's screens                                      http://localhost:18082
#   Gateway    posts approved repayments to Fineract and Odoo, sends approved messages (.NET)
#   Messaging  a stand-in SMS and WhatsApp provider: each phone's inbox   http://localhost:18083
#
# Everything here is synthetic and for local use. Secrets come from .env (copy .env.example).

name: repaydesk

x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment=${REPAYDESK_ENV:-local}

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      FINERACT_DB_PASSWORD: ${FINERACT_DB_PASSWORD:?set FINERACT_DB_PASSWORD in .env}
      ODOO_DB_PASSWORD: ${ODOO_DB_PASSWORD:?set ODOO_DB_PASSWORD in .env}
      REPAYDESK_DB_PASSWORD: ${REPAYDESK_DB_PASSWORD:?set REPAYDESK_DB_PASSWORD in .env}
      LANGFUSE_DB_PASSWORD: ${LANGFUSE_DB_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/01-databases.sh:/docker-entrypoint-initdb.d/01-databases.sh:ro
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-U", "postgres"]
      interval: 5s
      retries: 20

  fineract:
    image: apache/fineract:1.12.1
    depends_on:
      db:
        condition: service_healthy
    environment:
      FINERACT_NODE_ID: "1"
      FINERACT_SERVER_PORT: "8080"
      FINERACT_SERVER_SSL_ENABLED: "false"
      FINERACT_HIKARI_DRIVER_SOURCE_CLASS_NAME: org.postgresql.Driver
      FINERACT_HIKARI_JDBC_URL: jdbc:postgresql://db:5432/fineract_tenants
      FINERACT_HIKARI_USERNAME: fineract
      FINERACT_HIKARI_PASSWORD: ${FINERACT_DB_PASSWORD}
      FINERACT_DEFAULT_TENANTDB_HOSTNAME: db
      FINERACT_DEFAULT_TENANTDB_PORT: "5432"
      FINERACT_DEFAULT_TENANTDB_UID: fineract
      FINERACT_DEFAULT_TENANTDB_PWD: ${FINERACT_DB_PASSWORD}
      FINERACT_DEFAULT_TENANTDB_NAME: fineract_default
      FINERACT_DEFAULT_TENANTDB_IDENTIFIER: default
      FINERACT_DEFAULT_TENANTDB_TIMEZONE: Africa/Lagos
      FINERACT_DEFAULT_TENANTDB_DESCRIPTION: Repaydesk demo tenant
      FINERACT_DEFAULT_MASTER_PASSWORD: ${FINERACT_MASTER_PASSWORD:?set FINERACT_MASTER_PASSWORD in .env}
      FINERACT_DEFAULT_TENANTDB_MASTER_PASSWORD: ${FINERACT_MASTER_PASSWORD}
      FINERACT_CONTENT_FILESYSTEM_ROOT_FOLDER: /tmp
      JAVA_TOOL_OPTIONS: -Xmx1G -XX:+UseContainerSupport -XX:TieredStopAtLevel=1
    ports:
      - "127.0.0.1:18080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/fineract-provider/actuator/health | grep -q UP"]
      interval: 10s
      start_period: 60s
      retries: 30

  # Fineract's own staff screens (the Mifos X web app). It runs in the browser and calls
  # Fineract directly, so the API address is the one the browser sees, not the compose one.
  mifos:
    image: openmf/web-app:1.14
    depends_on:
      fineract:
        condition: service_healthy
    environment:
      FINERACT_API_URLS: ${FINERACT_PUBLIC_URL:-http://127.0.0.1:18080}
      FINERACT_API_URL: ${FINERACT_PUBLIC_URL:-http://127.0.0.1:18080}
      FINERACT_API_PROVIDER: /fineract-provider/api
      FINERACT_API_VERSION: /v1
      FINERACT_PLATFORM_TENANT_IDENTIFIER: default
      MIFOS_DEFAULT_LANGUAGE: en-US
      MIFOS_SUPPORTED_LANGUAGES: en-US
      MIFOS_PRELOAD_CLIENTS: "false"
      MIFOS_ENABLE_COPILOT: "false"
    ports:
      - "127.0.0.1:18081:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      retries: 10

  # Repaydesk's own screens: the React app, served by nginx, which also passes /api to the API.
  web:
    build: ./services/web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:18082:80"

  # Creates the ledger database with the accounting app, once. Odoo itself starts after.
  odoo-init:
    image: odoo:18.0
    depends_on:
      db:
        condition: service_healthy
    environment: &odoo-env
      HOST: db
      USER: odoo
      PASSWORD: ${ODOO_DB_PASSWORD}
    command: >
      sh -c "psql postgresql://odoo:$${PASSWORD}@db/postgres -tAc \"SELECT 1 FROM pg_database WHERE datname='ledger'\" | grep -q 1
      || odoo --db_host=db --db_user=odoo --db_password=$${PASSWORD}
      -d ledger -i account --without-demo=all --load-language=en_US --stop-after-init"
    volumes:
      - odoodata:/var/lib/odoo

  odoo:
    image: odoo:18.0
    depends_on:
      odoo-init:
        condition: service_completed_successfully
    environment: *odoo-env
    command: ["odoo", "-d", "ledger", "--db-filter=^ledger$$", "--proxy-mode"]
    volumes:
      - odoodata:/var/lib/odoo
    ports:
      - "127.0.0.1:18069:8069"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:8069/web/health || exit 1"]
      interval: 10s
      start_period: 30s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.137.0
    command: ["--config=/etc/otelcol/collector.yaml"]
    volumes:
      - ./infra/otel/collector.yaml:/etc/otelcol/collector.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/jaeger:2.11.0
    ports:
      - "127.0.0.1:16686:16686"

  # One-shot: migrates the Repaydesk database, sets up Fineract and Odoo, loads the
  # synthetic book and writes a week of incoming payments. Safe to re-run: it skips
  # anything already seeded unless given --reset.
  seed:
    build: ./services/core
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
      fineract:
        condition: service_healthy
      odoo:
        condition: service_healthy
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: repaydesk-seed
      REPAYDESK_DATABASE_URL: postgresql://repaydesk:${REPAYDESK_DB_PASSWORD}@db:5432/repaydesk
      FINERACT_URL: http://fineract:8080/fineract-provider/api/v1
      FINERACT_TENANT: default
      FINERACT_USERNAME: ${FINERACT_USERNAME:-mifos}
      FINERACT_PASSWORD: ${FINERACT_PASSWORD:-password}
      ODOO_URL: http://odoo:8069
      ODOO_DB: ledger
      ODOO_USERNAME: ${ODOO_USERNAME:-admin}
      ODOO_PASSWORD: ${ODOO_PASSWORD:-admin}
      FINERACT_READ_USERNAME: ${FINERACT_READ_USERNAME:-repaydesk-read}
      FINERACT_READ_PASSWORD: ${FINERACT_READ_PASSWORD:?set FINERACT_READ_PASSWORD in .env}
      FINERACT_GATEWAY_USERNAME: ${FINERACT_GATEWAY_USERNAME:-repaydesk-gateway}
      FINERACT_GATEWAY_PASSWORD: ${FINERACT_GATEWAY_PASSWORD:?set FINERACT_GATEWAY_PASSWORD in .env}
      ODOO_READ_USERNAME: ${ODOO_READ_USERNAME:-repaydesk-read}
      ODOO_READ_PASSWORD: ${ODOO_READ_PASSWORD:?set ODOO_READ_PASSWORD in .env}
      BANK_NAME: ${BANK_NAME:-Demo Microfinance Bank}
      SEED_BORROWERS: ${SEED_BORROWERS:-2000}
      SEED_RANDOM: ${SEED_RANDOM:-42}
      DATA_DIR: /data
      PAYRAIL_WEBHOOK_SECRET: ${PAYRAIL_WEBHOOK_SECRET:-dev-only-payrail-secret}
    volumes:
      - ./data:/data

  # The API: the payment provider's webhook, staff sign-in, approvals, and the web app's reads.
  api:
    build: ./services/core
    command: ["uvicorn", "repaydesk.api:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: repaydesk-api
      REPAYDESK_DATABASE_URL: postgresql://repaydesk:${REPAYDESK_DB_PASSWORD}@db:5432/repaydesk
      PAYRAIL_WEBHOOK_SECRET: ${PAYRAIL_WEBHOOK_SECRET:-dev-only-payrail-secret}
      STAFF_DEMO_PASSWORD: ${STAFF_DEMO_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # The gateway rechecks approvals with the same threshold.
      TWO_PERSON_ABOVE_KOBO: ${TWO_PERSON_ABOVE_KOBO:-50000000}
      # Read only: a borrower's or loan's page asks core banking live.
      FINERACT_URL: http://fineract:8080/fineract-provider/api/v1
      FINERACT_TENANT: default
      FINERACT_USERNAME: ${FINERACT_READ_USERNAME:-repaydesk-read}
      FINERACT_PASSWORD: ${FINERACT_READ_PASSWORD:?set FINERACT_READ_PASSWORD in .env}
    ports:
      - "127.0.0.1:18000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      start_period: 10s
      retries: 20

  # The borrower directory: copies the book from Fineract every 15 minutes, for search and lists.
  directory:
    build: ./services/core
    command: ["python", "-m", "repaydesk.directory", "--every", "900"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      fineract:
        condition: service_healthy
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: repaydesk-directory
      REPAYDESK_DATABASE_URL: postgresql://repaydesk:${REPAYDESK_DB_PASSWORD}@db:5432/repaydesk
      FINERACT_URL: http://fineract:8080/fineract-provider/api/v1
      FINERACT_TENANT: default
      FINERACT_USERNAME: ${FINERACT_READ_USERNAME:-repaydesk-read}
      FINERACT_PASSWORD: ${FINERACT_READ_PASSWORD:?set FINERACT_READ_PASSWORD in .env}

  # The posting gateway (.NET): the only writer to Fineract and the ledger (ADR 0002). It drains
  # the posting outbox, rechecking each approval against the decisions before it posts.
  gateway:
    build: ./services/gateway
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy  # the API's start applies the database migrations
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: repaydesk-gateway
      REPAYDESK_DATABASE_URL: postgresql://repaydesk:${REPAYDESK_DB_PASSWORD}@db:5432/repaydesk
      FINERACT_URL: http://fineract:8080/fineract-provider/api/v1
      FINERACT_TENANT: default
      FINERACT_USERNAME: ${FINERACT_GATEWAY_USERNAME:-repaydesk-gateway}
      FINERACT_PASSWORD: ${FINERACT_GATEWAY_PASSWORD:?set FINERACT_GATEWAY_PASSWORD in .env}
      ODOO_URL: http://odoo:8069
      ODOO_DB: ledger
      ODOO_USERNAME: ${ODOO_USERNAME:-admin}
      ODOO_PASSWORD: ${ODOO_PASSWORD:-admin}
      TWO_PERSON_ABOVE_KOBO: ${TWO_PERSON_ABOVE_KOBO:-50000000}
      MESSAGING_URL: http://messaging:8000
      MESSAGING_TOKEN: ${MESSAGING_TOKEN:-dev-only-messaging-token}
    healthcheck:
      test: ["CMD", "dotnet", "Repaydesk.Gateway.dll", "--healthy"]
      interval: 15s
      start_period: 15s
      retries: 5

  # A stand-in for the SMS and WhatsApp provider: takes messages from the gateway as an
  # aggregator's API would, and shows each phone's inbox. Nothing leaves the machine.
  messaging:
    build: ./services/core
    restart: unless-stopped
    command: ["uvicorn", "repaydesk.simulators.messaging:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      MESSAGING_TOKEN: ${MESSAGING_TOKEN:-dev-only-messaging-token}
      SIM_DB: /sim/messaging.db
      SIM_UNREACHABLE: ${SIM_UNREACHABLE:-}
    volumes:
      - simdata:/sim
    ports:
      - "127.0.0.1:18083:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      start_period: 10s
      retries: 20

  # One-shot: picks up new statement files from data/inbox. With --replay-webhooks it instead
  # delivers the recorded provider webhooks to the API, one request each.
  ingest:
    build: ./services/core
    profiles: ["tools"]
    command: ["python", "-m", "repaydesk.ingest"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: repaydesk-ingest
      REPAYDESK_DATABASE_URL: postgresql://repaydesk:${REPAYDESK_DB_PASSWORD}@db:5432/repaydesk
      PAYRAIL_WEBHOOK_SECRET: ${PAYRAIL_WEBHOOK_SECRET:-dev-only-payrail-secret}
      DATA_DIR: /data
    volumes:
      - ./data:/data

  # One-shot: rule matching over every new line. Reads Fineract; writes only proposals.
  match:
    build: ./services/core
    profiles: ["tools"]
    command: ["python", "-m", "repaydesk.match"]
    depends_on:
      db:
        condition: service_healthy
      fineract:
        condition: service_healthy
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: repaydesk-match
      REPAYDESK_DATABASE_URL: postgresql://repaydesk:${REPAYDESK_DB_PASSWORD}@db:5432/repaydesk
      FINERACT_URL: http://fineract:8080/fineract-provider/api/v1
      FINERACT_TENANT: default
      FINERACT_USERNAME: ${FINERACT_READ_USERNAME:-repaydesk-read}
      FINERACT_PASSWORD: ${FINERACT_READ_PASSWORD:?set FINERACT_READ_PASSWORD in .env}
      DATA_DIR: /data
    volumes:
      - ./data:/data

  # MCP servers (ADR 0008): read-only lookups for the investigator agent and any MCP client. They
  # speak stdio, so an MCP client starts one with `docker compose run --rm -T bankbook` (see .mcp.json).
  bankbook:
    build: ./services/core
    profiles: ["tools"]
    command: ["python", "-m", "repaydesk.servers.bankbook"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: repaydesk-bankbook
      REPAYDESK_DATABASE_URL: postgresql://repaydesk:${REPAYDESK_DB_PASSWORD}@db:5432/repaydesk
      FINERACT_URL: http://fineract:8080/fineract-provider/api/v1
      FINERACT_TENANT: default
      FINERACT_USERNAME: ${FINERACT_READ_USERNAME:-repaydesk-read}
      FINERACT_PASSWORD: ${FINERACT_READ_PASSWORD:?set FINERACT_READ_PASSWORD in .env}

  ledger:
    build: ./services/core
    profiles: ["tools"]
    command: ["python", "-m", "repaydesk.servers.ledger"]
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: repaydesk-ledger
      ODOO_URL: http://odoo:8069
      ODOO_DB: ledger
      ODOO_READ_USERNAME: ${ODOO_READ_USERNAME:-repaydesk-read}
      ODOO_READ_PASSWORD: ${ODOO_READ_PASSWORD:?set ODOO_READ_PASSWORD in .env}

  # One-shot: the investigator agent over payments no rule could place (ADR 0009). Reads through the
  # bankbook MCP server; writes agent runs, proposals for people to review, and suspense.
  investigate:
    build: ./services/core
    profiles: ["tools"]
    command: ["python", "-m", "repaydesk.investigate"]
    depends_on:
      db:
        condition: service_healthy
      fineract:
        condition: service_healthy
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: repaydesk-investigator
      REPAYDESK_DATABASE_URL: postgresql://repaydesk:${REPAYDESK_DB_PASSWORD}@db:5432/repaydesk
      FINERACT_URL: http://fineract:8080/fineract-provider/api/v1
      FINERACT_TENANT: default
      FINERACT_USERNAME: ${FINERACT_READ_USERNAME:-repaydesk-read}
      FINERACT_PASSWORD: ${FINERACT_READ_PASSWORD:?set FINERACT_READ_PASSWORD in .env}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
      INVESTIGATOR_MODEL: ${INVESTIGATOR_MODEL:-claude-sonnet-5-5}
      CLASSIFIER_MODEL: ${CLASSIFIER_MODEL:-claude-haiku-5-5}
      AGENT_MIN_CONFIDENCE: ${AGENT_MIN_CONFIDENCE:-0.7}

  # One-shot: the collections drafting agent. Drafts the morning's messages for a manager to approve;
  # sends nothing. Same settings as the investigator.
  draft:
    extends: investigate
    command: ["python", "-m", "repaydesk.collections.draft"]
    environment:
      OTEL_SERVICE_NAME: repaydesk-drafter
      DRAFTER_MODEL: ${DRAFTER_MODEL:-claude-sonnet-5-5}

  # One-shot: milestone 2's demo. A new statement arrives, is ingested and matched, Amaka and Tunde
  # approve through the API, and the gateway posts; then it checks Fineract and Odoo themselves.
  demo:
    build: ./services/core
    profiles: ["tools"]
    command: ["python", "-m", "repaydesk.demo"]
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: repaydesk-demo
      REPAYDESK_DATABASE_URL: postgresql://repaydesk:${REPAYDESK_DB_PASSWORD}@db:5432/repaydesk
      API_URL: http://api:8000
      STAFF_DEMO_PASSWORD: ${STAFF_DEMO_PASSWORD:-}
      TWO_PERSON_ABOVE_KOBO: ${TWO_PERSON_ABOVE_KOBO:-50000000}
      BANK_NAME: ${BANK_NAME:-Demo Microfinance Bank}
      PAYRAIL_WEBHOOK_SECRET: ${PAYRAIL_WEBHOOK_SECRET:-dev-only-payrail-secret}
      # Reads only: the loans it pays and, afterwards, what the gateway posted.
      FINERACT_URL: http://fineract:8080/fineract-provider/api/v1
      FINERACT_TENANT: default
      FINERACT_USERNAME: ${FINERACT_READ_USERNAME:-repaydesk-read}
      FINERACT_PASSWORD: ${FINERACT_READ_PASSWORD:?set FINERACT_READ_PASSWORD in .env}
      ODOO_URL: http://odoo:8069
      ODOO_DB: ledger
      ODOO_USERNAME: ${ODOO_USERNAME:-admin}
      ODOO_PASSWORD: ${ODOO_PASSWORD:-admin}
      DATA_DIR: /data
    volumes:
      - ./data:/data

volumes:
  pgdata:
  odoodata:
  simdata:
